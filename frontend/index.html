<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- the android status bar takes this, so the shell stops flashing white before
       the app's own ground appears. same value as --color-bg in style.css. -->
  <meta name="theme-color" content="#111315">
  <title>SafeAR — Industrial Safety Training</title>
  <!-- The theme is stamped before the first paint. This is a copy of the rule in
       js/theme.js on purpose: a module import resolves too late and the worker
       would see a flash of the wrong theme. Both read the same key. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("safear_theme");
        var theme = (stored === "dark" || stored === "light") ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/prerequisite.css">
  <!-- vendored, not cdn: a mine has no signal. aframe must load before ar.js -->
  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/aframe-ar.js"></script>
</head>
<body>
  <div id="app">
    <!-- audio/icon first navigation for workers -->
  </div>
  <!-- plain script, not a module: it must set the api base before app.js runs -->
  <script src="./config.js"></script>
  <script src="./js/app.js" type="module"></script>
</body>
</html>
