<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeAR — Hiro Marker (Extinguisher Station)</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .marker-box {
      width: 280px;
      height: 280px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      box-sizing: border-box;
      padding: 42px;
      border-radius: 4px;
    }
    .marker-inner {
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #3b82f6;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.92rem;
      line-height: 1.4;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="marker-badge" class="badge">🧯 HIRO MARKER (EXTINGUISHER STATION)</div>
    <p id="marker-desc">Point your phone camera at this marker to trigger the 3D Fire Extinguisher.</p>
    <div class="marker-box">
      <div class="marker-inner">
        <svg viewBox="0 0 100 100" fill="#000">
          <text x="50" y="65" font-size="32" font-family="sans-serif" font-weight="900" text-anchor="middle">Hiro</text>
        </svg>
      </div>
    </div>
    <p id="marker-footer" style="font-size:0.8rem;color:#64748b;">SafeAR Industrial Safety Platform — Tier 2 Marker Anchor</p>
  </div>
  <script type="module">
    import { t } from "../js/i18n.js";
    const badge = document.getElementById("marker-badge");
    const desc = document.getElementById("marker-desc");
    const footer = document.getElementById("marker-footer");
    if (badge) badge.textContent = t("marker.hiro_badge", "🧯 HIRO MARKER (EXTINGUISHER STATION)");
    if (desc) desc.textContent = t("marker.hiro_desc", "Point your phone camera at this marker to trigger the 3D Fire Extinguisher.");
    if (footer) footer.textContent = t("marker.footer", "SafeAR Industrial Safety Platform — Tier 2 Marker Anchor");
  </script>
</body>
</html>
